<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Aragria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="app">
    <button id="sidebar-toggle" type="button" aria-label="사이드바 열기/닫기" aria-expanded="false"></button>
    <div id="sidebar-backdrop" hidden></div>
    <aside id="sidebar">
      <header id="status-header">
        <span id="status-name">접속 중...</span>
      </header>
      <section class="status-block">
        <h2>장비</h2>
        <ul id="equipment"></ul>
      </section>
      <section class="status-block">
        <h2>아이템</h2>
        <ul id="inventory"></ul>
      </section>
      <section class="status-block">
        <h2>지도</h2>
        <div id="map-canvas"></div>
      </section>
      <footer id="status-footer">
        <span id="conn-status" class="off">연결 끊김</span>
      </footer>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" title="드래그하여 사이드바 크기 조절"></div>
    <section id="viewport">
      <div id="combat-view" hidden></div>
      <div id="log" aria-live="polite"></div>
      <div id="object-view" hidden></div>
      <div id="touch-controls">
        <div id="dpad" aria-label="이동 패널">
          <button class="dpad-btn dpad-up" type="button" data-dir="north" aria-label="북쪽으로 이동">▲</button>
          <button class="dpad-btn dpad-left" type="button" data-dir="west" aria-label="서쪽으로 이동">◀</button>
          <button class="dpad-btn dpad-down" type="button" data-dir="south" aria-label="남쪽으로 이동">▼</button>
          <button class="dpad-btn dpad-right" type="button" data-dir="east" aria-label="동쪽으로 이동">▶</button>
        </div>
        <div id="action-pad" aria-label="액션 패널">
          <button class="action-btn" id="action-a" type="button">공격</button>
          <button class="action-btn" id="action-b" type="button">봐</button>
        </div>
      </div>
      <form id="prompt-form" autocomplete="off">
        <span class="prompt-glyph" id="mode-glyph">&gt;</span>
        <input id="prompt" name="prompt" type="text" placeholder="명령 입력 — ESC로 이동 모드 전환" autofocus />
        <span id="mode-badge" class="mode-typing">TYPING</span>
      </form>
    </section>
  </main>
  <div id="welcome-overlay" hidden>
    <div id="welcome-card">
      <h2>모험가 등록</h2>
      <p class="welcome-hint">아라그리아에 처음 들어선 당신의 정보를 알려주세요. 입력한 특징을 바탕으로 전투 시 캐릭터 모습이 그려집니다.</p>
      <form id="welcome-form" autocomplete="off">
        <label>
          <span>이름</span>
          <input id="welcome-name" type="text" maxlength="16" required placeholder="예: 카이런" />
        </label>
        <label>
          <span>특징</span>
          <textarea id="welcome-desc" rows="4" maxlength="200" required placeholder="예: 어깨에 까마귀를 얹은 은발 마법사, 검은 망토와 푸른 룬 지팡이"></textarea>
        </label>
        <div id="welcome-error" class="welcome-error" hidden></div>
        <button type="submit">입장</button>
      </form>
    </div>
  </div>
  <script src="/env.js"></script>
  <script src="/client.js"></script>
</body>
</html>
