services:
  - type: web
    name: agria
    runtime: node
    plan: free
    region: singapore
    branch: develop
    buildCommand: npm ci
    startCommand: npm start
    # 영속성은 Turso(libsql embedded replica) 가 책임진다 — Render free 의
    # ephemeral fs 에 local.db 를 두지만 부팅 시 primary 로부터 sync 되어
    # 데이터가 자동 복구되므로 별도 persistent disk 가 필요 없다.
    envVars:
      - key: NODE_VERSION
      # 네이버 OAuth — 키 발급 후 Render 대시보드에서 값 입력. 비워 두면
      # /env.js 의 AGRIA_NAVER_LOGIN=false 가 되어 클라가 로그인 버튼을 숨긴다.
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      # 콜백 URL. https 종단(Render) 환경에서는 풀 URL 명시 권장.
      # 예: https://agria.onrender.com/auth/naver/callback
      - key: NAVER_CALLBACK_URL
        sync: false
      # 프록시 뒤 https 환경에서 세션 쿠키에 Secure 플래그 강제.
      - key: SESSION_COOKIE_SECURE
        value: 'true'
      # Turso 데이터베이스 — `turso db create agria` 로 만들고
      # `turso db tokens create agria` 로 토큰 발급. 미설정이면 standalone
      # 로컬 SQLite 모드로 떨어져 ephemeral 한 dev 실행만 가능.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
